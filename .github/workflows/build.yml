name: Build installers

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 42's postinstall does require() on an ESM-only package,
          # which needs Node >= 22.12 (require(esm)). Node 20 fails npm ci.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      - name: Smoke-test installer (silent install + launch)
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse -Path out/make -Filter 'Nightwave-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found under out/make" }
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

          Write-Host "Running silent install…"
          Start-Process -FilePath $setup.FullName -ArgumentList '--silent' -Wait

          $installDir = Join-Path $env:LOCALAPPDATA 'iptv_player'
          if (-not (Test-Path $installDir)) { throw "Install directory not found: $installDir" }
          # The real app lives in app-<version>\ ; the root exe is only a Squirrel stub.
          $exe = Get-ChildItem -Recurse -Path $installDir -Filter 'iptv-player.exe' |
                 Where-Object { $_.FullName -match '\\app-' } | Select-Object -First 1
          if (-not $exe) { throw "Versioned app executable (app-*\iptv-player.exe) not found under $installDir" }
          Write-Host "✔ Installed: $($exe.FullName)"

          # Squirrel creates the shortcut asynchronously under Programs\<CompanyName>\, so search recursively.
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $lnk = Get-ChildItem -Recurse -Path $programs -Filter 'Nightwave.lnk' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $lnk) { Start-Sleep -Seconds 1 }
          } while (-not $lnk -and (Get-Date) -lt $deadline)
          if (-not $lnk) { throw "Start menu shortcut Nightwave.lnk not found under $programs" }
          Write-Host "✔ Shortcut: $($lnk.FullName)"

          Write-Host "Launching app to verify it boots…"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--no-sandbox' -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "App exited immediately (exit code $($p.ExitCode)) — boot failed" }
          Write-Host "✔ App still running (pid $($p.Id)) after 20s — boot OK"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-windows-installer
          path: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES

  linux:
    # rpm >= 4.20 (ubuntu-26.04) bricht electron-installer-redhat ab (#3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # maker-deb needs dpkg/fakeroot, maker-rpm needs rpmbuild, and the smoke
      # test needs a virtual display to start the GUI.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg xvfb

      - name: Install dependencies
        run: npm ci

      # `npm ci` legt die Electron-Binary auf diesem Runner nicht ab, obwohl das
      # postinstall-Skript durchläuft — der erste UI-Test scheiterte deshalb mit
      # ENOENT auf node_modules/electron/dist/electron. Das electron-Paket lädt
      # sie beim ersten require() nach; hier explizit, damit ein Fehlschlag
      # sichtbar an dieser Stelle auftritt und nicht in einem Testschritt.
      - name: Electron-Binary bereitstellen
        run: node -e "console.log('Electron:', require('electron'))"

      - name: Unit tests
        run: npm test

      # Vier Konfigurationen, weil jede etwas anderes abdeckt und die
      # Standardkonfiguration allein die Kernprüfungen überspringt: mit
      # TEST_CHANNELS=420 und Länderpräfixen hat das größte Land nur 105
      # Kanäle, und der Guard `setsize > 400` lässt "Pfeiltasten kommen über
      # Position 300 hinaus" — die zentrale Behauptung der Spec — dann SKIP
      # melden. Getrennte Schritte, damit im Log sofort sichtbar ist, welche
      # Konfiguration gefallen ist.
      - name: UI smoke test (Standard, Länderebene)
        run: xvfb-run -a npm run test:ui

      - name: UI smoke test (20 000 Kanäle — Virtualisierung + Guide-Budget)
        run: TEST_CHANNELS=20000 xvfb-run -a npm run test:ui

      - name: UI smoke test (ohne Länderpräfixe — keine Länderebene)
        run: TEST_PREFIXED=0 xvfb-run -a npm run test:ui

      # Die härteste Wache für das Guide-Zeitbudget: ohne Länderfilter baut der
      # Guide über die volle Playlist. Die Variante, die die Zeilen für alle
      # Kanäle auflöste, brauchte hier 6,8s statt 0,1s.
      - name: UI smoke test (20 000 Kanäle ohne Länderpräfixe)
        run: TEST_PREFIXED=0 TEST_CHANNELS=20000 xvfb-run -a npm run test:ui

      - name: UI smoke test (Login-Bildschirm)
        run: SCENARIO=login xvfb-run -a npm run test:ui

      - name: UI smoke test (URL-Wechsel beim Login)
        run: SCENARIO=failover-login xvfb-run -a npm run test:ui

      - name: UI smoke test (URL-Wechsel beim Start)
        run: SCENARIO=failover-start xvfb-run -a npm run test:ui

      - name: UI smoke test (Abmelden während des URL-Wechsels)
        run: SCENARIO=failover-logout xvfb-run -a npm run test:ui

      - name: UI smoke test (URL-Wechsel nur für Filme)
        run: SCENARIO=failover-vod xvfb-run -a npm run test:ui

      - name: UI smoke test (gemerktes Land beim Start)
        run: SCENARIO=live-restore xvfb-run -a npm run test:ui

      - name: UI smoke test (gemerkter Kanal zieht das Land mit)
        run: SCENARIO=live-restore-channel xvfb-run -a npm run test:ui

      - name: UI smoke test (Moduswechsel während des Kanal-Restores)
        run: SCENARIO=live-restore-switch xvfb-run -a npm run test:ui

      - name: UI smoke test (Handwahl während des Kanal-Restores)
        run: SCENARIO=live-restore-manual xvfb-run -a npm run test:ui

      - name: UI smoke test (Weiter in der Ladephase der Filme)
        run: SCENARIO=vod-delay xvfb-run -a npm run test:ui

      - name: Build Linux packages
        run: npm run make

      - name: Smoke-test the unpacked app (launch under Xvfb)
        run: |
          set -euo pipefail
          exe=$(find out -maxdepth 3 -type f -name iptv-player -perm -u+x | head -1)
          if [ -z "$exe" ]; then echo "app binary not found under out/"; exit 1; fi
          test -f "$(dirname "$exe")/resources/icon.png" || { echo "resources/icon.png missing"; exit 1; }
          echo "Launching $exe"
          xvfb-run -a "$exe" --no-sandbox &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then echo "App exited immediately — boot failed"; exit 1; fi
          echo "✔ App still running (pid $pid) after 20s — boot OK"
          kill -9 "$pid" 2>/dev/null || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-linux-packages
          path: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
