name: Build installers

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 42's postinstall does require() on an ESM-only package,
          # which needs Node >= 22.12 (require(esm)). Node 20 fails npm ci.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run make

      - name: Smoke-test installer (silent install + launch)
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse -Path out/make -Filter 'IPTV-Player-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "Setup.exe not found under out/make" }
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

          Write-Host "Running silent install…"
          Start-Process -FilePath $setup.FullName -ArgumentList '--silent' -Wait

          $installDir = Join-Path $env:LOCALAPPDATA 'iptv_player'
          if (-not (Test-Path $installDir)) { throw "Install directory not found: $installDir" }
          # The real app lives in app-<version>\ ; the root exe is only a Squirrel stub.
          $exe = Get-ChildItem -Recurse -Path $installDir -Filter 'iptv-player.exe' |
                 Where-Object { $_.FullName -match '\\app-' } | Select-Object -First 1
          if (-not $exe) { throw "Versioned app executable (app-*\iptv-player.exe) not found under $installDir" }
          Write-Host "✔ Installed: $($exe.FullName)"

          Write-Host "Launching app to verify it boots…"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--no-sandbox' -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "App exited immediately (exit code $($p.ExitCode)) — boot failed" }
          Write-Host "✔ App still running (pid $($p.Id)) after 20s — boot OK"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-windows-installer
          path: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # maker-deb needs dpkg/fakeroot, maker-rpm needs rpmbuild, and the smoke
      # test needs a virtual display to start the GUI.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg xvfb

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run make

      - name: Smoke-test the unpacked app (launch under Xvfb)
        run: |
          set -euo pipefail
          exe=$(find out -maxdepth 3 -type f -name iptv-player -perm -u+x | head -1)
          if [ -z "$exe" ]; then echo "app binary not found under out/"; exit 1; fi
          echo "Launching $exe"
          xvfb-run -a "$exe" --no-sandbox &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then echo "App exited immediately — boot failed"; exit 1; fi
          echo "✔ App still running (pid $pid) after 20s — boot OK"
          kill -9 "$pid" 2>/dev/null || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-linux-packages
          path: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/deb/**/*.deb
            out/make/rpm/**/*.rpm
            out/make/zip/**/*.zip
