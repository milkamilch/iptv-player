<!--
  Quelle für assets/icon.png und assets/icon.ico. Neu rendern:
    rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png
    magick assets/icon.png -define icon:auto-resize=256,128,64,48,32,24,16 assets/icon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nw-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#7f5ae0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1c1a26"/>
      <stop offset="1" stop-color="#0d0d0e"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#b98cff" stroke-opacity="0.18" stroke-width="4"/>
  <path d="M104 300 C152 204,200 204,248 300 S344 396,392 300" fill="none" stroke="url(#nw-grad)" stroke-width="48" stroke-linecap="round"/>
